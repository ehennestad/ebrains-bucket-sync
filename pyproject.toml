[project]
name = "ebrains-bucket-sync"
version = "0.1.0"
description = "Sync a local folder to an EBRAINS Data Proxy bucket, sending only new and changed files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ehennestad", email = "ehennestad@gmail.com" }]
keywords = ["EBRAINS", "data-proxy", "sync", "bucket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Archiving :: Mirroring",
]
dependencies = [
  "ebrains-drive>=0.7.0",
  "requests>=2.28",
  "click>=8.1",
  "platformdirs>=3.0",
]

[project.scripts]
ebrains-bucket-sync = "ebrains_bucket_sync.cli:main"

[project.urls]
Repository = "https://github.com/ehennestad/ebrains-bucket-sync"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebrains_bucket_sync"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs an EBRAINS login and a test bucket (EBRAINS_BUCKET_SYNC_TEST_BUCKET)"]
